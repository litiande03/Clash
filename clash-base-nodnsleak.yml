# Clash / Mihomo 底包：防 DNS 泄露（供 subconverter clash_rule_base 使用）
# 逻辑：
# - fake-ip：域名先由 Clash 接管，避免系统 DNS 直接查询国外域名
# - nameserver：国内 DNS（直连域名、解析 DoH 主机名）
# - fallback：国外 DoH/DoT；解析结果非 CN 时采用，降低污染与泄露
# - GEOIP no-resolve 在 ini 规则里配合使用

mixed-port: 7890
socks-port: 7891
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  # 这些域名返回真实 IP，避免局域网 / 特殊业务异常
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "+.local"
    - localhost
    - "*.home.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.apple.com"
    - "time1.*.com"
    - "time2.*.com"
    - "time3.*.com"
    - "time4.*.com"
    - "time5.*.com"
    - "time6.*.com"
    - "time7.*.com"
    - "ntp.*.com"
    - "ntp1.*.com"
    - "ntp2.*.com"
    - "ntp3.*.com"
    - "ntp4.*.com"
    - "ntp5.*.com"
    - "ntp6.*.com"
    - "ntp7.*.com"
    - "*.nr-data.net"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "lens.l.google.com"
    - "*.n.n.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.*.microsoft.com"
    - "*.*.xboxlive.com"
    - "*.mcdn.bilivideo.cn"
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - 223.5.5.5
    - 223.6.6.6
  fallback:
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
    - https://8.8.8.8/dns-query
    - https://dns.google/dns-query
    - tls://1.1.1.1:853
    - tls://8.8.8.8:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
      - 127.0.0.1/32

proxies: []

proxy-groups: []

rules:
  - MATCH,DIRECT
