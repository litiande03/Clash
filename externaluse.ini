[custom]
;不要随意改变关键字，否则会导致出错
;ACL4SSR / subconverter 自定义配置（外用 Clash）
;分组与分流对齐 externaluse-shadowrocket.conf
;ip138 走代理；媒体：pixman / 奥视澳门 / 4gtv
;应用：YouTube / Telegram / OpenAI / Gemini / Disney+ / Apple Intelligence / TikTok / Google
;内网穿透：中国大陆节点 + 手动切换
;分流对齐 Seven1 思路：境外域名→代理，国内域名/IP→直连，漏网之鱼默认代理
;自动测速：支持（排除 x2 及以上倍率节点）
;DNS 防泄露：clash-base-nodnsleak.yml（redir-host + 国外 DoH fallback）

;设置规则标志位
ruleset=🚀 国外流量,clash-classic:https://raw.githubusercontent.com/litiande03/Clash/refs/heads/master/rules/ip138.list
ruleset=❓ pixman,clash-classic:https://raw.githubusercontent.com/litiande03/Clash/refs/heads/master/rules/pixman.list
ruleset=❓ pixman,clash-classic:https://raw.githubusercontent.com/litiande03/Clash/refs/heads/master/rules/pixman-ntp.list
ruleset=🎦 奥视澳门,clash-classic:https://raw.githubusercontent.com/litiande03/Clash/refs/heads/master/rules/tmd.list
ruleset=🧋 4gtv,clash-classic:https://raw.githubusercontent.com/litiande03/Clash/refs/heads/master/rules/4gtv.list
ruleset=🚄 内网穿透,clash-classic:https://raw.githubusercontent.com/litiande03/Clash/refs/heads/master/rules/IntranetIP.list
;微信走国内流量（默认 DIRECT），避免开代理后消息/通话绕代理变慢
ruleset=🎯 国内流量,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/WeChat/WeChat.list
ruleset=📹 YouTube,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/YouTube/YouTube.list
ruleset=📲 Telegram,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Telegram/Telegram.list
ruleset=🤖 OpenAI,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/OpenAI/OpenAI.list
ruleset=✨ Gemini,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Gemini/Gemini.list
ruleset=🎥 Disney+,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Disney/Disney.list
ruleset=🍎🤖 AppleIntelligence,clash-classic:https://raw.githubusercontent.com/ddgksf2013/Filter/refs/heads/master/AppleIntelligence.list
ruleset=🎵 TikTok,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/TikTok/TikTok.list
ruleset=🔍 Google,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Google/Google.list
;境外域名（对应 Seven1 的 cn!_domain / geolocation-!cn）
ruleset=🚀 国外流量,clash-classic:https://raw.githubusercontent.com/litiande03/Clash/refs/heads/master/rules/ProxyGFWlist1.list
ruleset=🚀 国外流量,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global.list
;国内直连（对应 Seven1 的 cn_domain + bps_cn_ip）
ruleset=🎯 国内流量,clash-classic:https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 国内流量,clash-classic:https://raw.githubusercontent.com/litiande03/Clash/refs/heads/master/rules/ChinaCompanyIp.list
ruleset=🎯 国内流量,clash-classic:https://raw.githubusercontent.com/litiande03/Clash/refs/heads/master/rules/ChinaIp.list
ruleset=🎯 国内流量,[]GEOIP,CN,no-resolve
ruleset=🐟 漏网之鱼,[]FINAL
;设置规则标志位

;设置分组标志位（顺序与 externaluse-shadowrocket.conf 一致）
custom_proxy_group=🚀 国外流量`select`[]♻️ 自动选择`[]👌🏻 手动切换`[]DIRECT`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🇲🇾 马来西亚节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点
custom_proxy_group=🎯 国内流量`select`[]DIRECT`[]🚀 国外流量`[]♻️ 自动选择
custom_proxy_group=👌🏻 手动切换`select`.*
custom_proxy_group=♻️ 自动选择`url-test`(^(?!.*x(?:[2-9]|[1-9][0-9]))(?=.*(?:港|香港|HongKong|HK|Hong Kong|台|台湾|台灣|新北|彰化|TW|Taiwan|新加坡|狮城|SG|Singapore|马来西亚|Malaysia|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|美国|美利坚|USA|U.S.A|United States|America|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|Las Vegas|KR|Korea|韩国|KOR|首尔|韩|韓)).*$)`https://i.ytimg.com/generate_204`60,150
custom_proxy_group=♻️ 自动选择(非港)`url-test`(^(?!.*x(?:[2-9]|[1-9][0-9]))(?=.*(?:台|台湾|台灣|新北|彰化|TW|Taiwan|新加坡|狮城|SG|Singapore|马来西亚|Malaysia|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|美国|美利坚|USA|U.S.A|United States|America|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|Las Vegas|KR|Korea|韩国|KOR|首尔|韩|韓)).*$)`https://i.ytimg.com/generate_204`60,150
;仅测速、不参与分流；间隔更短便于查看延迟
custom_proxy_group=⚡ 自动测速`url-test`(^(?!.*x(?:[2-9]|[1-9][0-9]))(?=.*(?:港|香港|HongKong|HK|Hong Kong|台|台湾|台灣|新北|彰化|TW|Taiwan|新加坡|狮城|SG|Singapore|马来西亚|Malaysia|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|美国|美利坚|USA|U.S.A|United States|America|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|Las Vegas|KR|Korea|韩国|KOR|首尔|韩|韓|澳门|澳門|Macao|Macau)).*$)`https://i.ytimg.com/generate_204`15,50
custom_proxy_group=❓ pixman`select`(.*(港|香港|HongKong|HK|Hong Kong).*)
custom_proxy_group=🎦 奥视澳门`url-test`(^(?!.*x(?:[2-9]|[1-9][0-9]))(?=.*(?:澳门|澳門|Macao|Macau|macao|macau)).*$)`https://i.ytimg.com/generate_204`60,150
custom_proxy_group=🧋 4gtv`select`(.*(台湾|台灣|台|新北|彰化|TW|Taiwan).*)
custom_proxy_group=🚄 内网穿透`select`[]🇨🇳 中国大陆节点`[]👌🏻 手动切换`[]DIRECT
custom_proxy_group=🇨🇳 中国大陆节点`select`(.*(广东河源电信|广东广州电信|内网).*)
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 国外流量`[]♻️ 自动选择`[]DIRECT`[]👌🏻 手动切换
custom_proxy_group=📹 YouTube`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇲🇴 澳门节点`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🇲🇾 马来西亚节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]👌🏻 手动切换
custom_proxy_group=📲 Telegram`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🇲🇾 马来西亚节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]👌🏻 手动切换
custom_proxy_group=🎵 TikTok`select`[]♻️ 自动选择(非港)`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🇲🇾 马来西亚节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]👌🏻 手动切换
custom_proxy_group=🤖 OpenAI`select`[]♻️ 自动选择(非港)`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🇲🇾 马来西亚节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]👌🏻 手动切换
custom_proxy_group=✨ Gemini`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🇲🇾 马来西亚节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]👌🏻 手动切换
custom_proxy_group=🎥 Disney+`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🇲🇾 马来西亚节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]👌🏻 手动切换
custom_proxy_group=🍎🤖 AppleIntelligence`select`[]♻️ 自动选择(非港)`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🇲🇾 马来西亚节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]👌🏻 手动切换
custom_proxy_group=🔍 Google`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🇲🇾 马来西亚节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]👌🏻 手动切换
