# 外用 Mihomo / Stash 配置（对齐 externaluse）
# 独立目录：mihomo-ltd/（不改动仓库根目录旧 ini/conf）
# 结构参考 Seven1echo/Yaml：锚点 + rule-providers + icon
# 分流对齐本人现有 externaluse.ini；订阅请在客户端自行添加（本文件不含 proxy-providers）
# 重新生成：node mihomo-ltd/build.js
# DNS：redir-host（不用 fake-ip），兼顾防泄露与节点可用性

mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true

# ══ 锚点（未知字段会被内核忽略，仅供 YAML 合并） ══
Anchor_UT: &ut
  type: url-test
  include-all: true
  url: https://i.ytimg.com/generate_204
  interval: 60
  tolerance: 150
  lazy: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: redir-host
  use-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  proxy-server-nameserver:
    - 223.5.5.5
    - 8.8.8.8
  nameserver:
    - 223.5.5.5
    - 223.6.6.6
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - 1.1.1.1
    - 8.8.8.8
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
      - 127.0.0.1/32

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]


proxy-groups:
  - name: 国外流量
    type: select
    proxies:
      - 自动选择
      - 手动切换
      - DIRECT
      - 香港节点
      - 台湾节点
      - 新加坡节点
      - 马来西亚节点
      - 日本节点
      - 美国节点
      - 韩国节点
    icon: https://raw.githubusercontent.com/litiande03/Clash/master/icons/gw.png

  - name: 国内流量
    type: select
    proxies:
      - DIRECT
      - 国外流量
      - 自动选择
    icon: https://raw.githubusercontent.com/litiande03/Clash/master/icons/gn.png

  - name: 手动切换
    type: select
    include-all: true
    icon: https://raw.githubusercontent.com/litiande03/Clash/master/icons/sdxz.png

  - name: 自动选择
    <<: *ut
    filter: "(?i)^(?!.*x(?:[2-9]|[1-9][0-9]))(?=.*(港|香港|hong\s?kong|(?<![a-z])hk(?![a-z])|hkg|台|台湾|台灣|taiwan|(?<![a-z])tw(?![a-z])|新加坡|狮城|singapore|(?<![a-z])sg(?![a-z])|马来|malaysia|日本|tokyo|(?<![a-z])jp(?![a-z])|美国|america|(?<![a-z])us(?![a-z])|usa|韩国|korea|(?<![a-z])kr(?![a-z])|韩|韓)).*$"
    icon: https://raw.githubusercontent.com/litiande03/Clash/master/icons/zdxz.png

  - name: 自动选择(非港)
    <<: *ut
    filter: "(?i)^(?!.*x(?:[2-9]|[1-9][0-9]))(?=.*(台|台湾|台灣|taiwan|(?<![a-z])tw(?![a-z])|新加坡|狮城|singapore|(?<![a-z])sg(?![a-z])|马来|malaysia|日本|tokyo|(?<![a-z])jp(?![a-z])|美国|america|(?<![a-z])us(?![a-z])|usa|韩国|korea|(?<![a-z])kr(?![a-z])|韩|韓)).*$"
    icon: https://raw.githubusercontent.com/litiande03/Clash/master/icons/zdxz.png

  # 仅测速，不参与任何 RULE
  - name: 自动测速
    <<: *ut
    interval: 15
    tolerance: 50
    filter: "(?i)^(?!.*x(?:[2-9]|[1-9][0-9]))(?=.*(港|香港|hong\s?kong|(?<![a-z])hk(?![a-z])|澳门|澳門|macao|macau|台|台湾|台灣|taiwan|新加坡|狮城|singapore|马来|malaysia|日本|tokyo|美国|america|usa|韩国|korea|韩|韓)).*$"
    icon: https://raw.githubusercontent.com/litiande03/Clash/master/icons/Speedtest.png

  - name: pixman
    type: select
    include-all: true
    filter: "(?i)^(?=.*(港|香港|hong\s?kong|(?<![a-z])hk(?![a-z])|hkg|🇭🇰)).*$"
    icon: https://raw.githubusercontent.com/litiande03/Clash/master/icons/myTV_SUPER.png

  - name: 奥视澳门
    <<: *ut
    filter: "(?i)^(?!.*x(?:[2-9]|[1-9][0-9]))(?=.*(澳门|澳門|macao|macau|🇲🇴)).*$"
    icon: https://raw.githubusercontent.com/litiande03/Clash/master/icons/tdm.png

  - name: 4gtv
    type: select
    include-all: true
    filter: "(?i)^(?=.*(台|台湾|台灣|新北|彰化|taiwan|taipei|(?<![a-z])tw(?![a-z])|tpe|khh|🇹🇼)).*$"
