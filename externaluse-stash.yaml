# 外用 Stash 配置（分组与分流对齐 externaluse-shadowrocket.conf）
# 用法：
# 1. 在下方 proxy-providers 里按机场各写一条，改好 url
# 2. Stash > 配置 > 从文件/URL 导入本 yaml
# 3. 模式选 rule（规则）
# 策略组已用 include-all，会自动汇总所有订阅里的节点
# 不要再用 subconverter / ACL4SSR 转换
# 远程更新（推到仓库后）：
# https://raw.githubusercontent.com/litiande03/Clash/refs/heads/master/externaluse-stash.yaml

mode: rule
log-level: info
ipv6: true

dns:
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  nameserver:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
  nameserver-policy:
    "geosite:cn":
      - 223.5.5.5
      - 223.6.6.6
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - localhost
    - "*.local"

# 多个机场：每个机场单独一条，名字自定、不要重复
# url 用机场提供的 Clash / Stash 订阅链接
# 排除节点名中的 emoji（含国旗符号）；只保留无 emoji 的节点
# emoji-exclude: (?!.*[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{2300}-\x{23FF}\x{2B00}-\x{2BFF}\x{1F1E0}-\x{1F1FF}\x{FE00}-\x{FE0F}\x{200D}])
proxy-providers:
  机场A:
    url: "https://example.com/clash-sub-a"
    interval: 3600
    filter: '^(?!.*[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{2300}-\x{23FF}\x{2B00}-\x{2BFF}\x{1F1E0}-\x{1F1FF}\x{FE00}-\x{FE0F}\x{200D}]).+$'
  机场B:
    url: "https://example.com/clash-sub-b"
    interval: 3600
    filter: '^(?!.*[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{2300}-\x{23FF}\x{2B00}-\x{2BFF}\x{1F1E0}-\x{1F1FF}\x{FE00}-\x{FE0F}\x{200D}]).+$'
  # 机场C:
  #   url: "https://example.com/clash-sub-c"
  #   interval: 3600
  #   filter: '^(?!.*[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{2300}-\x{23FF}\x{2B00}-\x{2BFF}\x{1F1E0}-\x{1F1FF}\x{FE00}-\x{FE0F}\x{200D}]).+$'

proxy-groups:
  - name: 国外流量
    type: select
    proxies:
      - 自动选择
      - 手动切换
      - DIRECT
      - 香港节点
      - 台湾节点
      - 新加坡节点
      - 马来西亚节点
      - 日本节点
      - 美国节点
      - 韩国节点
    icon: https://raw.githubusercontent.com/litiande03/Clash/master/stash-ico/gw.png

  - name: 国内流量
