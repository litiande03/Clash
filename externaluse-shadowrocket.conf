🎵 TikTok = select, ♻️ 自动选择(非港), 🇹🇼 台湾节点, 🇸🇬 新加坡节点, 🇲🇾 马来西亚节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇰🇷 韩国节点, 👌🏻 手动切换
🤖 OpenAI = select, ♻️ 自动选择(非港), 🇹🇼 台湾节点, 🇸🇬 新加坡节点, 🇲🇾 马来西亚节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇰🇷 韩国节点, 👌🏻 手动切换
✨ Gemini = select, ♻️ 自动选择, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇸🇬 新加坡节点, 🇲🇾 马来西亚节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇰🇷 韩国节点, 👌🏻 手动切换
🎥 Disney+ = select, ♻️ 自动选择, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇸🇬 新加坡节点, 🇲🇾 马来西亚节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇰🇷 韩国节点, 👌🏻 手动切换
🍎🤖 AppleIntelligence = select, ♻️ 自动选择(非港), 🇹🇼 台湾节点, 🇸🇬 新加坡节点, 🇲🇾 马来西亚节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇰🇷 韩国节点, 👌🏻 手动切换
🔍 Google = select, ♻️ 自动选择, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇸🇬 新加坡节点, 🇲🇾 马来西亚节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇰🇷 韩国节点, 👌🏻 手动切换
🐟 漏网之鱼 = select, 🚀 国外流量, ♻️ 自动选择, DIRECT, 👌🏻 手动切换

[Rule]
# 顺序与 externaluse.ini 一致：ip138 → 媒体 → 内网 → App → GFW → 国内 IP / GEOIP → 漏网之鱼
