# Clash / Mihomo 底包：防 DNS 泄露（兼顾节点可用性）
# 说明：
# - 不用 fake-ip（容易导致机场节点域名解析失败、大量节点不可用）
# - 用 redir-host：DNS 仍由 Clash 处理，系统不会直接查国外域名
# - proxy-server-nameserver：专门解析节点服务器域名，走明文 IP DNS，避免连节点前死锁
# - nameserver 国内 + fallback 国外 DoH/IP，非 CN 结果走 fallback，防污染/泄露

mixed-port: 7890
socks-port: 7891
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090

profile:
  store-selected: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: redir-host
  listen: 127.0.0.1:1053
  use-hosts: true
  # 仅 IP，用来解析下面 DoH 主机名
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  # 节点域名单独解析，不走 fake-ip / 不依赖代理，避免节点全挂
  proxy-server-nameserver:
    - 223.5.5.5
    - 8.8.8.8
  nameserver:
    - 223.5.5.5
    - 223.6.6.6
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - 1.1.1.1
    - 8.8.8.8
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
      - 127.0.0.1/32

proxies: []

proxy-groups: []

rules:
  - MATCH,DIRECT
