# 代理组：include-all 同时纳入机场 proxies 与 proxy-providers 中的节点。
# icon 与 scripts/group-icons.js、icons/ 目录对齐；OpenClash Dashboard / Meta 面板可显示。
proxy-groups!:
  - name: "国外流量"
    type: select
    icon: https://raw.githubusercontent.com/litiande03/Clash/master/icons/gw.png
    proxies:
      - "自动选择"
      - "手动切换"
      - DIRECT
      - "香港节点"
      - "台湾节点"
      - "新加坡节点"
      - "马来西亚节点"
      - "日本节点"
      - "美国节点"
      - "韩国节点"
  - name: "国内流量"
    type: select
    icon: https://raw.githubusercontent.com/litiande03/Clash/master/icons/gn.png
    proxies:
      - DIRECT
      - "国外流量"
      - "自动选择"
  - name: "手动切换"
    type: select
    icon: https://raw.githubusercontent.com/litiande03/Clash/master/icons/sdxz.png
    include-all: true
  - name: "自动选择"
    type: url-test
    icon: https://raw.githubusercontent.com/litiande03/Clash/master/icons/zdxz.png
    include-all: true
    filter: "(?i)(港|香港|HongKong|HK|Hong Kong|台|台湾|台灣|新北|彰化|TW|Taiwan|新加坡|狮城|SG|Singapore|马来西亚|Malaysia|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|美国|美利坚|USA|U.S.A|United States|America|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|Las Vegas|KR|Korea|韩国|KOR|首尔|韩|韓)"
