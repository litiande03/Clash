#!NAME = Home_OpenClash
#!DESC = Home.ini 家庭分流规则原生 OpenClash 覆写模块
#!CONFIG = all

[YAML]
# 测速口径对齐花云：
# - unified-delay + gstatic 轻量探测
# - 不在此处写 dns/redir-host，避免盖掉 OpenClash UCI 的 fake-ip（这是原订阅延迟偏低的主因）
unified-delay: true
ipv6: true

# 规则集：用合并（不要 rule-providers!），保留 OpenClash 注入的 oc-cn-domain 等，
# 否则 fake-ip-filter 引用 rule-set:oc-cn-domain 会直接解析失败。
# home_ 前缀仍避免与机场原有 provider 重名。
rule-providers:
  home_hm_epg:
    type: http
    behavior: classical
    format: text
    path: ./rule_provider/home_hm_epg.list
    url: https://raw.githubusercontent.com/litiande03/Clash/refs/heads/master/rules/hm-epg.list
    interval: 86400
